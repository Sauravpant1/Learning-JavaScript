<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="demo.css">
</head>
<body>
    <form>
        <h1>Temperature conversion :</h1>
        <input type="number" value="0" id="myNumber">
        <br>
        <input type="radio" id="toFaren" name="unit" >
        <label for="toFaren" id="label">Celcius ➡️ farenheit</label><br>
        <input type="radio" id="toCelcius" name="unit">
        <label for="toCelcius" id="label">farenheit ➡️ celcius</label><br>
        <button id="myBtn">Submit</button>
        <p id="ans"></p>

    </form>
    <script src="inedx.js"></script>

</body>
</html>
